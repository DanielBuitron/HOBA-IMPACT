  caja.innerHTML=rows.length?rows.map(it=>'<a href="/HOBA-IMPACT/c/p/'+it.id+'">'+(it.imagen?imgDe(it.imagen,it.nombre,'',0):'<span></span>')+'<span><b>'+esc(it.nombre)+'</b><small>'+esc(it.tipo||'HOBA')+'</small></span></a>').join(''):'<p class=nada>No hay un producto con ese nombre.</p>';
}
const PORTADA={
  'Tácticos verde oliva':'cat-oliva-020.png',
  'Táctico verde manzana':'cat-manzana-001.png',
  'Táctico tono 511':'cat-tono511-001.png',
  'Deportivos':'cat-dep-007.png',
  'Esquemas':'cat-esq-044.png',
  'Botas':'cat-bota-021.png',
  'Toallas en microfibra personalizadas':'cat-toalla-014.png',
  'Buzos licrados':'cat-buzo-001.png',
  'Productos Milfort':'cat-mil-002.png'
};
function porFoto(nombre){return ITEMS.find(x=>(x.imagen||'').indexOf(nombre)>=0)}
function dePortada(c){return porFoto(PORTADA[c]||'')||ITEMS.find(x=>x.tipo===c&&x.imagen)}
const CORTO={
  'Tácticos verde oliva':'Oliva',
  'Táctico verde manzana':'Manzana',
  'Táctico tono 511':'Tono 511',
  'Deportivos':'Deportivos',
  'Esquemas':'Esquemas',
  'Botas':'Botas',
  'Toallas en microfibra personalizadas':'Toallas',
  'Buzos licrados':'Buzos',
  'Productos Milfort':'Milfort'
};
const MOSAICO=['Tácticos verde oliva','Táctico verde manzana','Táctico tono 511','Botas','Toallas en microfibra personalizadas','Deportivos'];
function tituloFuerte(t){
  const s=String(t||'').replace(/\.$/,'');
  const i=s.lastIndexOf(' ');
  if(i<1)return esc(s);
  return esc(s.slice(0,i))+' <em>'+esc(s.slice(i+1))+'</em>';
}
function listaLinea(c,n){
  const primero=dePortada(c);
  const resto=ITEMS.filter(it=>it.tipo===c&&(!primero||it.id!==primero.id));
  return (primero?[primero]:[]).concat(resto).slice(0,n);
}
function inicio(){
  const p=CFG.paginas.inicio;
  const grupo=porFoto('cat-oliva-010.png');
  const fondo='<img class=fondo src="/HOBA-IMPACT/inicio/img/web-portada.jpg?v=1" alt="'+(grupo?esc(grupo.nombre):'Grupo con uniforme HOBA')+'" fetchpriority="high" decoding="async">';
  const hero=p.hero?'<section class=banner>'+fondo+'<div class=banner-txt><p class=kicker>'+esc(p.kicker)+'</p><h1>'+tituloFuerte(p.titulo)+'</h1><p class=lead>'+esc(p.lead)+'</p><div class=acciones><a class=rojo href="/HOBA-IMPACT/c">Ver catálogo</a><a class=claro id=waHero href="https://wa.me/'+esc(WA)+'">WhatsApp</a></div></div></section>':'<main><p class=ojo>'+esc(p.kicker)+'</p><h2>'+esc(p.titulo)+'</h2><p class=lead>'+esc(p.lead)+'</p></main>';
  const mosaico=p.categorias?'<nav class=mosaico>'+MOSAICO.map(c=>{const it=dePortada(c);return '<a href="/HOBA-IMPACT/c?tipo='+encodeURIComponent(c)+'">'+(it?imgDe(it.imagen,CORTO[c]||c,'loading="lazy"',0):'')+'<b>'+esc(CORTO[c]||c)+'</b></a>'}).join('')+'</nav>':'';
  const oficiales=CFG.categorias||[];
  const bloques=oficiales.map(c=>{
    const lista=listaLinea(c,8);
    if(!lista.length)return '';
    return '<section><div class=linea-top><h2>'+esc(c)+'</h2></div><div class=riel>'+lista.map(it=>'<a class=card href="/HOBA-IMPACT/c/p/'+it.id+'"><span class=marco>'+(it.imagen?imgDe(it.imagen,it.nombre,'loading="lazy"',0):'<div class=letra>'+esc((it.nombre||'?')[0])+'</div>')+'</span><div class=c><small>'+esc(CORTO[c]||it.tipo||'')+'</small><h3>'+esc(it.nombre)+'</h3><b class=precio>'+(it.precio?money(it.precio):'Precio al confirmar')+'</b></div></a>').join('')+'</div></section>';
  }).join('');
  const grid=p.tienda?'<div class=tienda>'+bloques+'</div>':'';
  return hero+mosaico+grid;
}
function pedir(){
  const p=CFG.paginas.pedir;
  const pasos=(p.pasos||[]).filter(x=>x.t||x.p).map((x,i)=>'<article class=paso><span>0'+(i+1)+'</span><b>'+esc(x.t)+'</b><p>'+esc(x.p)+'</p></article>').join('');
  const faq=(p.faq||[]).filter(x=>x.q||x.a).map((x,i)=>'<details'+(i?'':' open')+'><summary>'+esc(x.q)+'</summary><p>'+esc(x.a)+'</p></details>').join('');
  return '<main><p class=ojo>'+esc(p.ojo)+'</p><h2>'+esc(p.titulo)+'</h2><div class=pasos>'+pasos+'</div><section class=faq style="margin-top:28px"><p class=ojo>PREGUNTAS</p><h2>Antes de escribir</h2>'+faq+'</section></main>';
}
function bordado(){
  const fotos=[
    ['/HOBA-IMPACT/inicio/img/web-bor-nombre.png?v=2','El par: nombre y rango','Un ejemplo. El nombre, el rango y el color del hilo se arman con lo que pidas. Al lado va la presilla.',[['Nombre en el parche','El nombre'],['Rango','El rango'],['Color del hilo','Verde, azul o dorado'],['Presilla','Estrella y barras']]],
    ['/HOBA-IMPACT/inicio/img/web-bor-par.png?v=2','Presilla, fecha y unidad','La otra pieza del par. Estrellas, barras, la fecha y la sigla salen con tus datos.',[['Rango','Estrellas o barras'],['Fecha','09-2026'],['Unidad o sigla','La sigla'],['Color del hilo','Dorado o verde']]],
    ['/HOBA-IMPACT/inicio/img/web-bor-policia.png?v=3','Juego personalizado','Escudo, bandera, cinta y tipo de sangre. El ejemplo enseña el juego; el tuyo lleva tu nombre y tu cargo.',[['Nombre en el bordado','El nombre'],['Cargo','El cargo'],['Tipo de sangre','O+'],['Cinta','El texto de la cinta']]]
  ];
  const galeria=fotos.map((f,i)=>'<button type="button" class="ejemplo" data-i="'+i+'"><img src="'+f[0]+'" alt="'+esc(f[1])+'"><span><b>'+esc(f[1])+'</b><p>'+esc(f[2])+'</p></span></button>').join('');
  const form='<form id=form class=borde-form hidden><h3 id=bordeTit>Datos del bordado</h3><p>Estos datos le llegan al asesor.</p><div class=trampa aria-hidden=true><label>Web<input name=web tabindex=-1 autocomplete=off></label></div><input id=bordado type=hidden><div class=cols><label>Nombre<input id=nombre autocomplete=name required></label><label>WhatsApp<input id=telefono inputmode=tel autocomplete=tel placeholder="300 000 0000" required></label></div><label>Ciudad<input id=ciudad autocomplete=address-level2></label><div id=campos></div><p class=err id=error hidden></p><button class=enviar type=submit id=enviar>Enviar al asesor</button></form>';
  window._borFotos=fotos;
  return '<main class=bordado-pag><p class=ojo>BORDADO</p><h2>Bordado personalizado, directo en la prenda.</h2><p class=lead>Elige el ejemplo. Abajo se piden los datos de ese bordado y le llegan al asesor.</p><div class=ejemplos>'+galeria+'</div>'+form+'</main>';
}
function entrega(){
  const p=CFG.paginas.entrega;
  const tiempos=[['Con tela en bodega','Al día siguiente.'],['Sobre pedido','Entre 15 y 20 días.'],['El abono','El 50% aparta la venta cuando el comprobante se ve en el banco.']];
  return '<main><p class=ojo>'+esc(p.ojo)+'</p><h2>'+esc(p.titulo)+'</h2><div class=dos><article><b>'+esc(p.c1t)+'</b><p>'+esc(p.c1p)+'</p></article><article><b>'+esc(p.c2t)+'</b><p>'+esc(p.c2p)+'</p></article></div><div class=pasos style="margin-top:14px">'+tiempos.map((x,i)=>'<article class=paso><span>0'+(i+1)+'</span><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></article>').join('')+'</div></main>';
}
function contacto(){
  const p=CFG.paginas.contacto;
  const opts=ITEMS.map(it=>'<option value="'+esc(it.nombre)+'">'+esc(it.nombre)+'</option>').join('');
  return '<main><div class=contacto><div><p class=ojo>'+esc(p.ojo)+'</p><h2>'+esc(p.titulo)+'</h2><p>'+esc(p.texto)+'</p><a class=wa id=waBox href="https://wa.me/'+esc(WA)+'">WhatsApp 315 581 3545</a></div><form id=form><div class=trampa aria-hidden=true><label>Web<input name=web tabindex=-1 autocomplete=off></label></div><div class=cols><label>Nombre<input id=nombre autocomplete=name required></label><label>WhatsApp<input id=telefono inputmode=tel autocomplete=tel placeholder="300 000 0000" required></label></div><div class=cols><label>Ciudad<input id=ciudad autocomplete=address-level2></label><label>Prenda<select id=interes><option value="">Aún no la elijo</option>'+opts+'</select></label></div><label>Qué necesitas<textarea id=mensaje rows=3 required placeholder="Tallas, colores, logo o ciudad"></textarea></label><p class=err id=error hidden></p><button class=enviar type=submit id=enviar>Enviar consulta</button></form></div></main>';
}
function libre(){
  const p=(CFG.libres||[]).find(x=>x.id===PAG)||{titulo:'Página',texto:''};
  return '<main><article class=libre><p class=ojo>PÁGINA</p><h2>'+esc(p.titulo)+'</h2><p>'+esc(p.texto)+'</p></article></main>';
}
function ponerAsesor(){
  let a=$('#waFlot');
  if(!a){
    a=document.createElement('a');
    a.id='waFlot';
    a.className='wa-flot';
    a.target='_blank';
    a.rel='noopener noreferrer';
    a.setAttribute('aria-label','Hablar con un asesor por WhatsApp');
    a.innerHTML='<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#fff" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10 10 0 0 0 4.65 1.18h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.86c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.81-.11-.42-.14-.95-.31-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.16-1.54-1.16-2.94s.73-2.08 1-2.37c.24-.28.64-.41 1.02-.41.12 0 .23 0 .33.01.3.01.44-.05.68.52.24.6.83 2.06.9 2.21.07.15.12.32.02.52-.1.19-.14.32-.28.49-.14.17-.3.38-.42.51-.14.14-.28.29-.12.56.16.28.72 1.18 1.54 1.91 1.06.94 1.95 1.23 2.23 1.37.28.14.44.12.6-.07.16-.19.7-.81.88-1.09.19-.28.37-.23.62-.14.26.09 1.62.76 1.9.9.28.14.46.21.53.32.07.12.07.68-.17 1.36z"/></svg><span>Asesor</span>';
    document.body.appendChild(a);
  }
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, quiero hablar con un asesor de HOBA Impact');
}
function anotarVisita(pagina, extra){
  const cuerpo=typeof pagina==='object'?pagina:Object.assign({pagina:pagina||'inicio'}, extra||{});
  const body=JSON.stringify(cuerpo);
  try{
    if(navigator.sendBeacon){navigator.sendBeacon('/api/visita', new Blob([body],{type:'application/json'}));return}
  }catch(e){}
  fetch('/api/visita',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body,keepalive:true}).catch(function(){});
}
function pintar(){
  estilos();nav();menuCats();
  const busca=$('#busca');
  if(busca){
    busca.oninput=buscar;
    document.addEventListener('click',ev=>{if(!ev.target.closest('.busca')){$('#sugerencias').hidden=true}});
    busca.addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#sugerencias').hidden=true;busca.blur()}});
  }
  const mapa={inicio:inicio,pedir:pedir,bordado:bordado,entrega:entrega,contacto:contacto};
  $('#vista').innerHTML=(mapa[PAG]||libre)();
  const wa='https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, quiero un uniforme táctico.');
  ['waHero','waBox','waPie'].forEach(id=>{const a=$('#'+id);if(a)a.href=wa});
  ponerAsesor();
  anotarVisita(PAG||'inicio');
  document.querySelectorAll('.ejemplo').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.ejemplo').forEach(x=>x.classList.toggle('on',x===b));
    const form=$('#form'); if(!form||!window._borFotos)return;
    const foto=window._borFotos[+b.dataset.i];
    form.hidden=false;
    $('#bordado').value=foto[1];
    $('#bordeTit').textContent=foto[1];
    const pares=foto[3].map((c,n)=>'<label>'+esc(c[0])+'<input data-k="'+esc(c[0])+'" placeholder="'+esc(c[1])+'" required></label>');
    $('#campos').innerHTML='<div class=cols>'+pares.slice(0,2).join('')+'</div><div class=cols>'+pares.slice(2).join('')+'</div>';
    form.scrollIntoView({block:'nearest'});
  });
  const form=$('#form');
  if(!form)return;
  form.onsubmit=async ev=>{
    ev.preventDefault();
    const err=$('#error');err.hidden=true;
    const trampa=form.querySelector('[name=web]');
    const interes=$('#interes');
    const bordado=$('#bordado');
    const sueltos=[...form.querySelectorAll('#campos input')].filter(i=>i.value.trim());
    const escrito=$('#mensaje');
    const mensaje=sueltos.length?sueltos.map(i=>i.dataset.k+': '+i.value.trim()).join('. '):(escrito?escrito.value.trim():'');
    const body={nombre:$('#nombre').value.trim(),telefono:$('#telefono').value.trim(),ciudad:$('#ciudad').value.trim(),interes:interes?interes.value:'',bordado:bordado?bordado.value:'',mensaje:mensaje,web:trampa?trampa.value:''};
    $('#enviar').disabled=true;
    try{
      const texto=['Hola, escribo desde la página de HOBA Impact.','Nombre: '+body.nombre,'WhatsApp: '+body.telefono,'Ciudad: '+body.ciudad,body.bordado?('Bordado: '+body.bordado):'',body.interes?('Interés: '+body.interes):'',body.mensaje].filter(Boolean).join('\n');
      window.open('https://wa.me/573155813545?text='+encodeURIComponent(texto),'_blank','noopener');
      const sigue=bordado&&bordado.value?'<p>El mensaje quedó listo en WhatsApp para el asesor.</p>':'<p>El mensaje quedó listo en WhatsApp para el asesor.</p><p><a href="/HOBA-IMPACT/c">Abrir el catálogo</a></p>';
      form.innerHTML='<div class=ok><h3>Listo para enviar</h3>'+sigue+'</div>';
    }catch(e){err.hidden=false;err.textContent='No se pudo enviar. Revisa la conexión.';$('#enviar').disabled=false}
  };
}
pintar();
</script>
