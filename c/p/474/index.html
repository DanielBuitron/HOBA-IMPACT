<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Catálogo HOBA Impact</title>
<link rel="icon" href="/HOBA-IMPACT/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/HOBA-IMPACT/icono-pestana.png" sizes="32x32">
<style>
:root{--ink:#14110f;--red:#C8102E;--cream:#f4efe6;--mut:#6f6a62;--ln:#e4dcd0;--bg:#f3efe6;--paper:#f3efe6;--txt:#1a1614;--card:#fff;--ok:#1f7a4d;--campo:#fff;--header:radial-gradient(900px 140px at 8% 0%,#6a4030 0%,transparent 58%),linear-gradient(180deg,#3d3128 0%,#241c18 100%)}
*{box-sizing:border-box}
html,body{margin:0;background:#f3efe6;color:#1a1614}
body{font-family:Bahnschrift,"Segoe UI",system-ui,sans-serif;min-height:100vh;background:radial-gradient(900px 240px at 100% -80px,#efe6d8 0%,transparent 55%),#f3efe6;color:#1a1614}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%;display:block}
.cinta{background:#C8102E;color:#faf6f1;text-align:center;font-size:12px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;padding:9px 22px}
.cinta:before{content:none}
.tope{position:sticky;top:0;z-index:40}
.top{background:linear-gradient(180deg,#2a221c 0%,#1c1815 100%);color:#f6f1e8;padding:8px 18px 0;box-shadow:inset 0 -1px 0 #C8102E}
.cab{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:auto minmax(180px,1fr);gap:16px;align-items:center}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.busca{position:relative;min-width:0}
.busca input{width:100%;height:42px;border:0;border-radius:999px;background:#faf6f1;color:#1c1814;padding:0 18px;outline:0;box-shadow:0 0 0 1px #f4efe644}
.busca input:focus{box-shadow:0 0 0 2px #C8102E}
.sugerencias{position:absolute;top:48px;left:0;right:0;background:#fff;color:#161616;border-radius:10px;box-shadow:0 18px 40px #000a;max-height:420px;overflow:auto;z-index:60}
.sugerencias[hidden]{display:none}
.sugerencias a{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;padding:8px 10px;color:#161616;text-decoration:none}
.sugerencias a:hover{background:#f6f3ee}
.sugerencias img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:6px}
.sugerencias b{display:block;font-size:14px}
.sugerencias small{color:#6b6560;font-size:12px}
.sugerencias .nada{margin:0;padding:14px;color:#6b6560}
.logo{height:64px;width:64px;object-fit:contain;border-radius:0;display:block;background:transparent;text-decoration:none;flex:none;mix-blend-mode:lighten}
.marca h1{margin:0;font-size:14px;letter-spacing:.2em;font-weight:750}
.bajada{margin:1px 0 0;color:#d5cec2;font-size:12px}
.snav{display:flex;gap:4px;overflow:auto;margin:6px -18px 0;padding:0 18px 4px;scrollbar-width:none}
.snav::-webkit-scrollbar{display:none}
.snav a{position:relative;color:#e7dfd4;text-decoration:none;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:8px 10px;white-space:nowrap;font-weight:650;border-radius:0}
.snav a:after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:#C8102E;transform:scaleX(0);transform-origin:left;transition:transform .22s ease}
.snav a:hover{color:#fff}
.snav a:hover:after,.snav a.on:after{transform:scaleX(1)}
.snav a.on{color:#fff}
.cats{display:none}
.cats::-webkit-scrollbar{display:none}
.cats a{display:flex;flex-direction:column;align-items:center;gap:7px;width:104px;flex:none;color:#1a1614;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;scroll-snap-align:start;text-align:center}
.cats a img{width:104px;height:104px;border-radius:20px;object-fit:contain;object-position:center;background:#faf6f1;border:0;padding:2px;flex:none;box-shadow:0 8px 18px #1c181422;transition:transform .25s ease,box-shadow .25s ease}
.cats a:hover{background:transparent;color:#C8102E;box-shadow:none;transform:none}
.cats a:hover img{box-shadow:0 0 0 2px #C8102E;transform:translateY(-5px)}
.cats a.on{background:transparent;color:#C8102E;border:0}
.cats a.on img{box-shadow:0 0 0 2px #C8102E}
.filtros{max-width:1200px;margin:0 auto;padding:16px 18px 0}
.linea-bar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 20px;border-bottom:1px solid #e4dcd0}
.lineas{display:flex;flex-wrap:wrap;gap:2px 26px;flex:1 1 520px}
.lineas button{border:0;background:transparent;color:#3a342f;font-size:16px;font-weight:650;padding:10px 0 12px;border-bottom:2px solid transparent;margin-bottom:-1px;border-radius:0;letter-spacing:0}
.lineas button:hover{color:#1c1815}
.lineas button.on{color:#C8102E;border-bottom-color:#C8102E}
#cuenta{color:#5c564f;font-size:14px;white-space:nowrap;padding:0 0 12px;margin-left:auto}
.afinar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;padding:14px 0 2px}
.fgrupos{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px}
.fgrupos label{display:flex;flex-direction:column;gap:5px;color:#1c1814;font-size:13px;font-weight:700}
.fgrupos select{height:38px;min-width:190px;border:1px solid #e4dcd0;background:#fff;color:#1c1814;border-radius:10px;font-size:14px;font-weight:650;padding:0 12px}
.fwrap{display:none}
#limpiar{border:0;background:transparent;color:#C8102E;height:38px;padding:0;font-size:13px;font-weight:750}
#limpiar[hidden]{display:none}
.fwrap input,.fwrap select{height:38px;border:1px solid #e4dcd0;background:#fff;color:#161616;border-radius:999px;font-size:13px;padding:0 14px}
.fwrap input{flex:1 1 160px;min-width:140px}
.fwrap select{flex:0 1 auto}
#cuenta{color:#6f6a62;font-size:12px;letter-spacing:.06em;margin-left:auto}
main{max-width:1200px;margin:0 auto;padding:16px 14px 120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;background:transparent}
@media(min-width:760px){.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.card{background:#faf6f1;border:0;border-radius:20px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;min-height:100%;color:#1c1814;box-shadow:0 10px 26px #1c181418;transition:transform .25s ease,box-shadow .25s ease}
a.arma-card{justify-content:flex-end;gap:6px;min-height:280px;padding:18px;text-decoration:none;color:#faf6f1;background:radial-gradient(140px 90px at 84% 12%,#C8102E88,transparent 70%),linear-gradient(160deg,#2a211c,#100e0c)}
a.arma-card span{letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:#e7dfd4}
a.arma-card b{font-size:26px;line-height:1}
a.arma-card small{color:#e7dfd4;font-size:13px}
.card:hover{transform:translateY(-8px);box-shadow:0 20px 36px #1c181438}
.card:active{transform:translateY(0)}
.foto{aspect-ratio:1;background:radial-gradient(circle at 50% 42%,#fff 0%,#f3ece3 74%);position:relative;padding:4px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 12px 14px #1a161422) contrast(1.04);transform:scale(1.05);transition:transform .45s ease}
.card:hover .foto img{transform:scale(1.08)}
.letra{width:100%;height:100%;display:grid;place-items:center;font-size:42px;font-weight:750;color:#94a3b8}
.sello{position:absolute;left:10px;top:10px;background:#161311;color:#f4efe6;border-radius:999px;border:0;padding:4px 8px;font-size:10px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
.sello.ahora{color:#86efac}
.sello.luego{color:#fdba74}
.cuerpo{padding:4px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cuerpo small{color:#8a8580;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.cuerpo h2{margin:0;font-size:14px;line-height:1.3;font-weight:550;color:#1c1814}
.precio{display:inline-block;width:max-content;background:transparent;color:#C8102E;font-weight:750;font-size:13px;padding:2px 0 0;font-variant-numeric:tabular-nums}
.puntos{display:flex;gap:4px;min-height:14px}
.punto{width:12px;height:12px;border-radius:50%;border:1px solid #0002}
.vacio{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:22px 16px;text-align:center;color:#6f6a62}
.vacio button{margin-top:8px;border:1px solid var(--red);background:transparent;color:var(--red);padding:8px 12px}
.barra{position:fixed;left:16px;right:16px;bottom:12px;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;background:#1c1815;color:#f6f1e8;border-radius:18px;border-top:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 14px 32px #120e0c55}
.barra b{display:block;font-size:14px}
.barra span{color:#d5cec2;font-size:12px}
.barra button{background:#C8102E;color:#faf6f1;border:0;border-radius:999px;padding:12px 16px;font-weight:750}
.velo{position:fixed;inset:0;background:#0b1220b8;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.velo[hidden]{display:none}
@media(min-width:860px){.velo{align-items:center;padding:24px}}
.panel{background:#fff;color:#161616;width:min(980px,100%);max-height:min(92vh,920px);border-radius:18px;border:1px solid var(--ln);border-top:3px solid var(--red);overflow:auto;position:relative}
@media(min-width:860px){.panel{border-radius:18px;max-height:min(88vh,860px)}}
.hoja{display:grid}
@media(min-width:860px){.hoja{grid-template-columns:1.05fr .95fr;align-items:start}}
.visor{background:#fff;min-height:280px;position:relative;padding:8px;overflow:hidden}
.visor img{width:100%;height:100%;max-height:560px;object-fit:contain;object-position:center;filter:drop-shadow(0 10px 16px #00000018)}
.giro{position:relative;height:min(520px,62vh);min-height:260px;touch-action:none;cursor:grab;user-select:none}
.giro.moviendo{cursor:grabbing}
.giro img{position:absolute;inset:0;max-height:none;pointer-events:none}
.pano{position:relative;height:min(520px,62vh);min-height:260px;touch-action:none;cursor:grab;user-select:none;perspective:1200px;display:grid;place-items:center}
.pano.moviendo{cursor:grabbing}
.pano-escena{width:min(500px,94%);aspect-ratio:5/3}
.pano-giro{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.visor .pano-frente,.visor .pano-reverso{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:transparent;border-radius:4px;filter:none}
.visor .pano-reverso{filter:brightness(.45) saturate(.55);transform:none}
.visor:has(.pano){overflow:visible}
.pista{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:8px;margin:0;background:#1c1815;color:#faf6f1;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:750;pointer-events:none}
.aro{width:64px;height:6px;border-radius:999px;background:#4a4038;position:relative}
.aro i{position:absolute;top:-2px;width:10px;height:10px;border-radius:50%;background:#C8102E;transform:translateX(-50%)}
.visor button.zoom{position:absolute;right:12px;bottom:12px;z-index:2;border:1px solid #3a3a3a;background:#1a1a1a;color:#f4efe6;border-radius:999px;padding:8px 12px;font-weight:700;font-size:13px}
.x{position:absolute;right:12px;top:12px;z-index:2;width:40px;height:40px;border:1px solid #3a3a3a;border-radius:50%;background:#1a1a1a;color:#f4efe6;font-size:20px}
.detalle{padding:18px 18px 24px;display:grid;gap:12px;align-content:start}
.detalle h2{margin:0;font-size:28px;line-height:1.1;color:#161616;letter-spacing:-.02em}
.detalle .desc{margin:0;color:#5c574e;line-height:1.5}
.aviso{margin:0;background:#2a1216;color:#fecaca;border-radius:2px;padding:10px 12px;font-size:14px}
.grupo{display:grid;gap:8px}
.grupo b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a39e94}
.ops{display:flex;flex-wrap:wrap;gap:8px}
.op{border:1px solid #e4dcd0;background:#fff;color:#161616;border-radius:999px;padding:10px 14px;display:flex;align-items:center;gap:8px;transition:transform .15s ease,background .15s ease}
.op.on{border-color:var(--red);background:#C8102E;color:#fff}
.op .punto{width:14px;height:14px}
.cant{display:flex;align-items:center;gap:8px}
.cant button{width:42px;height:42px;border-radius:12px;border:1px solid #e0d8cc;background:#fff;color:#161616;font-size:22px}
.cant input{width:72px;text-align:center;font-size:16px;padding:10px;border:1px solid #e0d8cc;border-radius:12px;background:#fff;color:#161616}
.agregar{background:#C8102E;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:750;font-size:16px;box-shadow:0 8px 18px #C8102E40}
.ya{margin:0;color:var(--ok);font-size:14px}
.luz{position:fixed;inset:0;background:#0b1220;z-index:60;display:grid;place-items:center;padding:16px}
.luz[hidden]{display:none}
.luz img{max-width:100%;max-height:100%;object-fit:contain}
.luz button{position:absolute;top:16px;right:16px;width:44px;height:44px;border:0;border-radius:50%;background:#fff}
.pedido{width:min(560px,100%)}
.pedido h2{margin:8px 0 0}
.linea{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--ln);align-items:center}
.linea img,.linea .letra{width:64px;height:64px;border-radius:2px;object-fit:contain;background:#fff}
.linea .letra{font-size:22px}
.linea p{margin:2px 0 0;color:var(--mut);font-size:13px}
.linea .cant button{width:34px;height:34px;font-size:18px}
.linea .menos{border:0;background:transparent;color:var(--red);font-weight:700;padding:0}
.total{display:flex;justify-content:space-between;font-size:18px;padding:8px 0 4px}
.form{display:grid;gap:10px;margin-top:8px}
.form label{display:grid;gap:4px;font-size:13px;color:#5c574e}
.form input,.form textarea{font-size:16px;padding:12px;border:1px solid #e0d8cc;border-radius:12px;width:100%;background:#fff;color:#161616}
.cols{display:grid;gap:10px}
@media(min-width:560px){.cols{grid-template-columns:1fr 1fr}}
.nota{color:var(--mut);font-size:13px;margin:0}
.okbox{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:16px;padding:16px}
.err{background:#fef2f2;color:#991b1b;border-radius:12px;padding:10px 12px;font-size:14px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0b1220;color:#fff;border-radius:14px;padding:12px 14px;z-index:50;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px #0006;max-width:calc(100% - 24px)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:#fecaca;font-weight:750}
.pad{padding:16px 16px 22px}
body.es-prenda .filtros{display:none}
#grid[hidden],#hoja[hidden]{display:none !important}
#hoja{max-width:1120px;margin:0 auto;padding:16px 14px 120px}
#hoja .panel{max-height:none;width:100%;border-radius:18px}
.atras{margin:0 0 10px}
.atras a{letter-spacing:.12em;text-transform:uppercase;font-size:12px;text-decoration:none}
.similares{margin-top:22px}
.similares h2{margin:4px 0 12px;font-size:22px}
.ojo{margin:0;color:var(--red);font-size:11px;font-weight:800;letter-spacing:.16em}
.carrusel{display:flex;gap:10px;overflow:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.carrusel a{flex:0 0 200px;scroll-snap-align:start;background:#fff;border:0;border-radius:18px;color:#161616;text-decoration:none;overflow:hidden;box-shadow:0 10px 24px #1a161418}
.carrusel img,.carrusel .letra{height:180px;width:100%;object-fit:contain;background:#fff}
.carrusel b{display:block;padding:8px 10px 0;font-size:14px}
.carrusel .precio{display:block;padding:4px 10px 10px}
.wa-flot{position:fixed;right:16px;bottom:88px;z-index:45;display:flex;align-items:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;border-radius:999px;padding:10px 14px 10px 10px;font-weight:750;box-shadow:0 10px 28px #0006}
.wa-flot svg{display:block}
body.es-prenda{background:#f3efe6;color:#161616}
body.es-prenda .top{color:#fff}
body.es-prenda #hoja .panel,
body.es-prenda .ficha{background:#fff;color:#161616;border:1px solid #e7e2d8}
body.es-prenda .visor,
body.es-prenda .foto{background:#fff}
body.es-prenda .detalle,
body.es-prenda .detalle h2{color:#161616}
body.es-prenda .detalle .desc,
body.es-prenda .detalle small,
body.es-prenda .grupo b,
body.es-prenda .nota,
body.es-prenda .form label{color:#5c574e}
body.es-prenda .op,
body.es-prenda .cant button,
body.es-prenda .cant input,
body.es-prenda .form input,
body.es-prenda .form textarea{background:#fff;color:#161616;border-color:#ddd}
body.es-prenda .op.on{background:#C8102E;color:#fff;border-color:#C8102E}
body.es-prenda .similares h2,
body.es-prenda .atras a{color:#161616}
body.es-prenda .carrusel a{background:#fff;color:#161616;border-color:#e7e2d8}
body.es-prenda .carrusel img,
body.es-prenda .carrusel .letra{background:#fff}
body.es-prenda .x,
body.es-prenda .visor button.zoom{background:#fff;color:#161616;border-color:#ddd}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #C8102E;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
@media(max-width:1100px){
  .snav a{letter-spacing:.05em;padding:8px 10px}
  .logo{width:64px;height:64px}
}
@media(max-width:800px){
  .cinta{font-size:11px;letter-spacing:.02em;line-height:1.35;padding:7px 12px}
  .cab{grid-template-columns:auto minmax(0,1fr);gap:8px}
  .busca{grid-column:1 / -1}
  .busca input{height:40px}
  .bajada{display:none}
  .logo{width:46px;height:46px}
  .marca h1{font-size:12px;letter-spacing:.08em}
  .snav{flex-wrap:wrap;overflow:visible;margin:2px 0 0;padding:0 0 4px;row-gap:0}
  .snav a{letter-spacing:.03em;font-size:11px;padding:8px 8px}
  .top{padding-left:10px;padding-right:10px}
  .filtros{padding:8px 12px 0}
  .linea-bar{gap:2px 10px}
  .lineas{flex:1 0 100%;min-width:0;flex-wrap:nowrap;overflow:auto;gap:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .lineas::-webkit-scrollbar{display:none}
  .lineas button{flex:none;font-size:15px;padding:8px 0 10px}
  #cuenta{flex:none;margin:0 0 6px auto;padding:0;white-space:nowrap}
  .afinar{display:block;width:100%;padding-top:8px}
  .fgrupos{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;width:100%}
  .fgrupos label:last-child{grid-column:1 / -1}
  .fgrupos label,.fgrupos select{width:100%;min-width:0}
  .fwrap{flex-wrap:nowrap;overflow:auto;padding-bottom:4px}
  .fwrap select,#limpiar{flex:none}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  main,#hoja{padding-left:10px;padding-right:10px}
  .detalle{padding:14px 14px 28px}
  .detalle h2{font-size:24px}
  .visor{padding:8px}
  .giro,.pano{height:min(380px,46vh);min-height:280px}
  .carrusel a{flex-basis:46vw}
  .barra.vacia{display:none}
  .wa-flot{bottom:calc(96px + env(safe-area-inset-bottom))}
  body:has(.barra.vacia) .wa-flot{bottom:calc(14px + env(safe-area-inset-bottom))}
  .barra{left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom))}
  .wa-flot span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .wa-flot{right:12px;padding:12px;border-radius:50%}
}
@media(max-width:420px){
  .cuerpo h2{font-size:13px}
  .cuerpo{padding:4px 8px 12px}
  .sello{left:8px;top:8px;font-size:9px}
}
</style>
</head>
<body>
<div class="cinta">Uniformes tácticos HOBA Impact · Tuluá · El precio se confirma al pedir</div>
<div class="tope">
<header class="top">

};
const ORDEN=['XS','S','M','L','XL','XXL','XXXL','Única','Unica','28','30','32','34','36','38','40','42','44','46'];
const F={tipo:'',disp:'',color:'',talla:'',para:''};
let carro=[];
try{carro=JSON.parse(sessionStorage.getItem('hoba-carro')||'[]');if(!Array.isArray(carro))carro=[]}catch(e){carro=[]}
let ficha=null, eleccion=null, pedido=false, toastT=0;
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function money(n){return '$'+Math.round(+n||0).toLocaleString('es-CO')}
function lista(t){return String(t||'').split(',').map(s=>s.trim()).filter(Boolean)}
function plano(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function paraDe(it){const n=plano(it.nombre);if(n.includes('mujer'))return 'Mujer';if(n.includes('hombre'))return 'Hombre';return 'Unisex'}
function pigmento(c){return PIG[plano(c)]||''}
function rotuloColor(c){return plano(c)==='el color del logo'?'Color del logo':c}
function tallasDe(it){const t=lista(it.tallas);return t.length?t:['Única']}
function coloresDe(it){return lista(it.colores)}
function guardar(){sessionStorage.setItem('hoba-carro',JSON.stringify(carro))}
function clave(x){return [x.id,x.talla,x.color,x.genero].join('|')}
function unidades(){return carro.reduce((a,x)=>a+(+x.cantidad||0),0)}
function total(){return carro.reduce((a,x)=>a+(+x.precio||0)*(+x.cantidad||0),0)}
function ordenTalla(a,b){const ia=ORDEN.indexOf(a),ib=ORDEN.indexOf(b);if(ia<0&&ib<0)return a.localeCompare(b,'es');if(ia<0)return 1;if(ib<0)return -1;return ia-ib}
function unicos(fn){const m=new Map();ITEMS.forEach(it=>fn(it).forEach(v=>{if(v)m.set(v,1)}));return [...m.keys()]}
function coincide(it){
  if(F.tipo&&it.tipo!==F.tipo)return false;
  if(F.disp&&it.disponibilidad!==F.disp)return false;
  if(F.color&&!coloresDe(it).some(c=>plano(c)===plano(F.color)))return false;
  if(F.talla&&!tallasDe(it).some(t=>t===F.talla))return false;
  if(F.para&&paraDe(it)!==F.para)return false;
  const q=plano($('#q').value);
  if(!q)return true;
  const bolsa=plano([it.nombre,it.tipo,it.descripcion,it.colores,it.tallas,it.disponibilidad].join(' '));
  return q.split(/\s+/).every(p=>bolsa.includes(p));
}
function visibles(){
  const rows=ITEMS.filter(coincide);
  const o=$('#orden').value;
  rows.sort((a,b)=>{
    if(o==='menor')return (+a.precio||9e15)-(+b.precio||9e15)||a.nombre.localeCompare(b.nombre,'es');
    if(o==='mayor')return (+b.precio||0)-(+a.precio||0)||a.nombre.localeCompare(b.nombre,'es');
    return String(a.nombre||'').localeCompare(String(b.nombre||''),'es');
  });
  return rows;
}
function opciones(id,pares){
  $(id).innerHTML=pares.map(([v,t])=>'<option value="'+esc(v)+'">'+esc(t)+'</option>').join('');
}
function armarFiltros(){
  const oficiales=(CFG&&CFG.categorias)||[];
  const extras=unicos(it=>it.tipo?[it.tipo]:[]).filter(v=>oficiales.indexOf(v)<0);
  opciones('#fTipo',[['', 'Categoría']].concat(oficiales.map(v=>[v,v])).concat(extras.map(v=>[v,v])));
  opciones('#fDisp',[['', 'Entrega']].concat(unicos(it=>it.disponibilidad?[it.disponibilidad]:[]).map(v=>[v,v])));
  opciones('#fColor',[['', 'Color']].concat(unicos(it=>coloresDe(it)).map(v=>[v,rotuloColor(v)])));
  opciones('#fTalla',[['', 'Talla']].concat(unicos(it=>tallasDe(it)).sort(ordenTalla).map(v=>[v,v])));
  opciones('#fPara',[['', 'Para'],['Hombre','Hombre'],['Mujer','Mujer'],['Unisex','Unisex']]);
}
function leerFiltros(){
  F.tipo=$('#fTipo').value;F.disp=$('#fDisp').value;F.color=$('#fColor').value;F.talla=$('#fTalla').value;F.para=$('#fPara').value;
}
function chica(src){return String(src||'').replace('/HOBA-IMPACT/c/img/','/HOBA-IMPACT/c/img/m-').replace(/\.png/g,'.jpg')}
function idDeFoto(src){
  const m=String(src||'').match(/\/c\/img\/(cat-[a-z0-9-]+)\.png/i);
  return m?m[1].replace(/^cat-/,'').replace(/-/g,''):'';

function enlazarGiro(){
  const g=$('#giro');if(!g)return;
  const imgs=[].slice.call(g.querySelectorAll('img'));
  if(imgs.length<2)return;
  let ang=+g.dataset.ang||0,x0=0,a0=0,activo=false;
  function cuadro(a){
    const paso=360/imgs.length;
    let n=Math.round(a/paso);
    n=((n%imgs.length)+imgs.length)%imgs.length;
    return n;
  }
  function pinta(){
    let a=ang%360;if(a<0)a+=360;
    const i=cuadro(a);
    imgs.forEach(function(im,k){im.style.opacity=k===i?'1':'0'});
    g.dataset.vista=imgs[i].dataset.full||imgs[i].src;
    g.setAttribute('aria-valuenow',String(Math.round(a)));
    const marca=$('#aro');if(marca)marca.style.left=(a/360*100)+'%';
  }
  function quieta(){
    let a=ang%360;if(a<0)a+=360;
    ang=cuadro(a)*(360/imgs.length);
    pinta();
  }
  function abajo(ev){
    if(ev.button!=null&&ev.button!==0)return;
    activo=true;g.classList.add('moviendo');
    x0=ev.clientX;a0=ang;
    try{g.setPointerCapture(ev.pointerId)}catch(e){}
  }
  function mueve(ev){
    if(!activo)return;
    ang=a0+(x0-ev.clientX)/Math.max(1,g.clientWidth)*360;
    pinta();
  }
  function suelta(){if(!activo)return;activo=false;g.classList.remove('moviendo');quieta()}
  g.addEventListener('pointerdown',abajo);
  g.addEventListener('pointermove',mueve);
  g.addEventListener('pointerup',suelta);
  g.addEventListener('pointercancel',suelta);
  g.addEventListener('keydown',function(ev){
    if(ev.key==='ArrowLeft'||ev.key==='ArrowRight'){
      ang=cuadro(ang)*(360/imgs.length)+(ev.key==='ArrowLeft'?-1:1)*(360/imgs.length);
      quieta();
      ev.preventDefault();
    }
  });
  pinta();
}

  const cant=Math.max(1,Math.min(5000,Math.round(+$('#cant').value||eleccion.cantidad||1)));
  eleccion.cantidad=cant;
  const linea={id:ficha.id,nombre:ficha.nombre,imagen:ficha.imagen||'',talla:eleccion.talla,color:eleccion.color,genero:eleccion.genero,cantidad:cant,precio:+ficha.precio||0};
  const i=carro.findIndex(x=>clave(x)===clave(linea));
  if(i>=0)carro[i]=linea;else carro.push(linea);
  guardar();pintaBarra();
  anotarVisita({pagina:'prenda', accion:'agregar', producto:ficha.id, nombre:ficha.nombre||''});
  const nombre=ficha.nombre;
  if(MODO==='prenda'){textoYa();mostrarToast(nombre+' quedó en el pedido');return}
  cerrar();
  mostrarToast(nombre+' quedó en el pedido');
}
function mostrarToast(t){
  $('#toastTxt').textContent=t;$('#toast').hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{$('#toast').hidden=true},3200);
}
function cerrar(){
  $('#velo').hidden=true;$('#luz').hidden=true;ficha=null;pedido=false;document.body.style.overflow='';
}
function abrirPedido(){
  if(!carro.length)return;
  ficha=null;pedido=true;
  $('#panel').className='panel pedido';
  $('#panel').innerHTML=htmlPedido();
  $('#velo').hidden=false;
  document.body.style.overflow='hidden';
  enlazarPedido();
}
function htmlPedido(){
  return '<div class=pad><button type=button class=x id=cerrar aria-label=Cerrar>×</button><h2>Tu pedido</h2><div id=lineas></div><div class=total><span>Referencia</span><b id=total></b></div><p class=nota>El valor es de referencia. Tu asesor confirma el abono y la entrega. Cada prenda queda como una cotización.</p><div id=error class=err hidden></div><form class=form id=form><div class=cols><label>Nombre<input id=nombre autocomplete=name required></label><label>WhatsApp<input id=telefono inputmode=tel autocomplete=tel placeholder="300 000 0000" required></label></div><div class=cols><label>Ciudad<input id=ciudad autocomplete=address-level2></label><label>Dirección<input id=direccion autocomplete=street-address></label></div><label>Nota<textarea id=nota rows=2 placeholder="Bordado, logo u otro detalle"></textarea></label><button class=agregar type=submit id=enviar>Enviar pedido</button></form></div>';
}
function pintaLineas(){
  $('#lineas').innerHTML=carro.map((x,i)=>{
    const it=itemDe(x.id)||x;
    const img=x.imagen?'<img src="'+esc(x.imagen)+'" alt="">':'<div class=letra>'+esc((x.nombre||'?')[0])+'</div>';
    return '<div class=linea>'+img+'<div><b>'+esc(x.nombre)+'</b><p>'+[x.talla,x.color,x.genero].filter(Boolean).map(esc).join(' · ')+'</p><div class=cant><button type=button data-dm="'+i+'">−</button><span>'+x.cantidad+'</span><button type=button data-dp="'+i+'">+</button></div></div><div><b>'+(x.precio?money(x.precio*x.cantidad):'')+'</b><br><button type=button class=menos data-dq="'+i+'">Quitar</button></div></div>';
  }).join('')||'<p class=nota>El pedido quedó vacío.</p>';
  $('#total').textContent=money(total());
  $('#lineas').querySelectorAll('[data-dm]').forEach(b=>b.onclick=()=>cambiar(+b.dataset.dm,-1));
  $('#lineas').querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>cambiar(+b.dataset.dp,1));
  $('#lineas').querySelectorAll('[data-dq]').forEach(b=>b.onclick=()=>{carro.splice(+b.dataset.dq,1);guardar();pintaBarra();pintaLineas()});
}
function cambiar(i,d){
  const x=carro[i];if(!x)return;
  x.cantidad=Math.max(1,Math.min(5000,x.cantidad+d));
  guardar();pintaBarra();pintaLineas();
}
function enlazarPedido(){
  $('#cerrar').onclick=cerrar;
  pintaLineas();
  let mem={};try{mem=JSON.parse(sessionStorage.getItem('hoba-contacto')||'{}')}catch(e){}
  ['nombre','telefono','ciudad','direccion','nota'].forEach(k=>{if(mem[k])$('#'+k).value=mem[k]});
  $('#form').onsubmit=enviar;
}
async function enviar(ev){
  ev.preventDefault();
  const err=$('#error');err.hidden=true;
  if(!carro.length){err.hidden=false;err.textContent='Agrega al menos una prenda.';return}
  const body={nombre:$('#nombre').value.trim(),telefono:$('#telefono').value.trim(),ciudad:$('#ciudad').value.trim(),direccion:$('#direccion').value.trim(),nota:$('#nota').value.trim(),lineas:carro.map(x=>({id:x.id,talla:x.talla,color:x.color,genero:x.genero,cantidad:x.cantidad}))};
  sessionStorage.setItem('hoba-contacto',JSON.stringify({nombre:body.nombre,telefono:body.telefono,ciudad:body.ciudad,direccion:body.direccion,nota:body.nota}));
  $('#enviar').disabled=true;
  try{
    const lineas=carro.map(x=>[x.cantidad+' x '+x.nombre,x.talla,x.color,x.genero].filter(Boolean).join(' · ')).join('\n');
    const texto=['Hola, quiero hacer un pedido en HOBA Impact.','Nombre: '+body.nombre,'WhatsApp: '+body.telefono,'Ciudad: '+body.ciudad,'Dirección: '+body.direccion,'Nota: '+body.nota,lineas].filter(Boolean).join('\n');
    window.open('https://wa.me/573155813545?text='+encodeURIComponent(texto),'_blank','noopener');
    carro=[];guardar();pintaBarra();
    $('#panel').innerHTML='<div class=pad><div class=okbox><h2>Pedido listo</h2><p>Se abrió WhatsApp con el pedido para el asesor. Si no se abrió, escríbele al mismo número.</p><button type=button class=agregar id=otro>Seguir mirando</button></div></div>';
    $('#otro').onclick=cerrar;
  }catch(e){err.hidden=false;err.textContent='No se pudo enviar. Revisa la conexión.';$('#enviar').disabled=false}
}
document.body.addEventListener('click',ev=>{
  const card=ev.target.closest('.card');
  if(card){if(card.dataset.id)location.href='/HOBA-IMPACT/c/p/'+card.dataset.id+'/';return}
  if(ev.target.id==='limpiar2')limpiar();
});
function limpiar(){
  F.tipo=F.disp=F.color=F.talla=F.para='';
  $('#q').value='';$('#orden').value='nombre';
  ['fTipo','fDisp','fColor','fTalla','fPara'].forEach(id=>$('#'+id).value='');
  history.replaceState(null,'','/HOBA-IMPACT/c');
  pintaGrid();
}
function sugerir(){
  const caja=$('#sugerencias');if(!caja)return;
  const q=plano($('#q').value).trim();
  if(!q){caja.hidden=true;caja.innerHTML='';return}
  const partes=q.split(/\s+/).filter(Boolean);
  const rows=ITEMS.filter(it=>{
    const bolsa=plano([it.nombre,it.tipo,it.descripcion,it.colores,it.tallas].join(' '));
    return partes.every(p=>bolsa.includes(p));
  }).slice(0,8);
  caja.hidden=false;
  caja.innerHTML=rows.length?rows.map(it=>'<a href="/HOBA-IMPACT/c/p/'+it.id+'">'+fotoHtml(it)+'<span><b>'+esc(it.nombre)+'</b><small>'+esc(it.tipo||'HOBA')+' · '+(it.precio?money(it.precio):'Precio al confirmar')+'</small></span></a>').join(''):'<p class=nada>No hay un producto con ese nombre.</p>';
}
$('#q').oninput=()=>{sugerir();pintaGrid()};
document.addEventListener('click',ev=>{if(!ev.target.closest('.busca')){const c=$('#sugerencias');if(c)c.hidden=true}});
$('#q').addEventListener('keydown',ev=>{if(ev.key==='Escape'){$('#sugerencias').hidden=true;$('#q').blur()}});
$('#q').addEventListener('focus',sugerir);
['fTipo','fDisp','fColor','fTalla','fPara','orden'].forEach(id=>$('#'+id).onchange=()=>{
  const el=$('#'+id);
  if(id==='fTipo'){
    history.replaceState(null,'','/HOBA-IMPACT/c'+(el&&el.value?('?tipo='+encodeURIComponent(el.value)):''));
    if(el&&el.value)anotarVisita({pagina:'catalogo', accion:'pestana', pestana:cortoCat()[el.value]||el.value});
  }
  leerFiltros();pintaGrid();
});
$('#limpiar').onclick=limpiar;
$('#ver').onclick=abrirPedido;
$('#toastIr').onclick=()=>{$('#toast').hidden=true;abrirPedido()};
$('#cerrarLuz').onclick=()=>{$('#luz').hidden=true};
$('#velo').addEventListener('click',ev=>{if(ev.target.id==='velo')cerrar()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#luz').hidden)$('#luz').hidden=true;else cerrar()}});
function destinoMenu(m){if(m.destino==='catalogo')return '/HOBA-IMPACT/c';if(m.destino==='toalla')return '/HOBA-IMPACT/inicio/toalla';if(m.destino==='bordar')return '/HOBA-IMPACT/inicio/bordar';if(m.destino==='panel')return '/HOBA-IMPACT/panel';if(m.destino==='inicio')return '/HOBA-IMPACT/inicio';return '/HOBA-IMPACT/inicio/'+m.destino}
function menusDe(lista){const quita={pedir:1,bordar:1,bordado:1,entrega:1};const menus=(lista||[]).filter(m=>m&&m.visible&&!quita[m.destino]);if(!menus.some(m=>m.destino==='toalla')){const item={titulo:'Tu toalla',destino:'toalla',visible:true};const i=menus.findIndex(m=>m.destino==='catalogo');if(i>=0)menus.splice(i+1,0,item);else menus.push(item)}return menus}
function cortoCat(){return {'Tácticos verde oliva':'Oliva','Táctico verde manzana':'Manzana','Táctico tono 511':'Tono 511','Deportivos':'Deportivos','Esquemas':'Esquemas','Botas':'Botas','Toallas en microfibra personalizadas':'Toallas','Buzos licrados':'Buzos','Productos Milfort':'Milfort'}}
function elegirTipo(tipo){
  if(MODO==='prenda'){location.href='/HOBA-IMPACT/c'+(tipo?('?tipo='+encodeURIComponent(tipo)):'');return}
  const sel=$('#fTipo'); if(sel)sel.value=tipo||'';
  leerFiltros();pintaGrid();
  history.replaceState(null,'','/HOBA-IMPACT/c'+(tipo?('?tipo='+encodeURIComponent(tipo)):''));
  if(tipo)anotarVisita({pagina:'catalogo',accion:'pestana',pestana:cortoCat()[tipo]||tipo});
}
function marcarLineas(){
  const t=$('#catActual');
  if(t)t.textContent=F.tipo?(cortoCat()[F.tipo]||F.tipo):'Todo el catálogo';
}
function pintaGrupos(){
  const lineas=$('#lineas');
  const box=$('#fgrupos');
  if(lineas&&!lineas.dataset.listo){
    lineas.dataset.listo='1';
    const nombres=cortoCat();
    const lista=(CFG&&CFG.categorias&&CFG.categorias.length)?CFG.categorias:Object.keys(nombres);
    lineas.innerHTML='<button type="button" data-v="">Todas</button>'+lista.map(c=>'<button type="button" data-v="'+esc(c)+'">'+esc(nombres[c]||c)+'</button>').join('');
    lineas.addEventListener('click',ev=>{
      const b=ev.target.closest('button'); if(!b)return;
      const sel=$('#fTipo'); if(!sel)return;
      const v=b.dataset.v||'';
      sel.value=sel.value===v?'':v;
      sel.dispatchEvent(new Event('change'));
    });
  }
  if(box&&!box.dataset.listo){
    box.dataset.listo='1';
    const rotulos={nombre:'Nombre',menor:'Precio más bajo',mayor:'Precio más alto'};
    const vacio={fColor:'Todos los colores',fPara:'Todos'};
    function vista(id,etiqueta){
      const sel=$('#'+id); if(!sel)return '';
      const reales=[...sel.options].filter(o=>o.value);
      if(id!=='orden'&&reales.length<2)return '';
      const html=[...sel.options].map(o=>{
        if(!o.value&&id==='orden')return '';
        const texto=o.value?(rotulos[o.value]||o.textContent):(vacio[id]||'Todos');
        return '<option value="'+esc(o.value)+'">'+esc(texto)+'</option>';
      }).join('');
      return '<label>'+esc(etiqueta)+'<select data-espejo="'+id+'">'+html+'</select></label>';
    }
    box.innerHTML=vista('fColor','Color')+vista('fPara','Para quién')+vista('orden','Ordenar');
    box.addEventListener('change',ev=>{
      const s=ev.target.closest('select'); if(!s)return;
      const real=$('#'+s.dataset.espejo); if(!real)return;
      real.value=s.value;
      real.dispatchEvent(new Event('change'));
    });
  }
  marcarGrupos();
}
function marcarGrupos(){
  const tipo=($('#fTipo')&&$('#fTipo').value)||'';
  document.querySelectorAll('#lineas button').forEach(b=>b.classList.toggle('on',(b.dataset.v||'')===tipo));
  document.querySelectorAll('#fgrupos select').forEach(s=>{
    const real=$('#'+s.dataset.espejo);
    if(real)s.value=real.value;
  });
  const lim=$('#limpiar');
  if(lim)lim.hidden=!(F.color||F.para||($('#q')&&$('#q').value)||($('#orden')&&$('#orden').value!=='nombre'));
}
function pintarMenu(){
  const e=(CFG&&CFG.estilos)||{};
  const map={tinta:'--ink',rojo:'--red',fondo:'--paper',tarjeta:'--card',texto:'--txt'};
  Object.entries(map).forEach(([k,v])=>{if(e[k])document.documentElement.style.setProperty(v,e[k])});
  const nav=$('#snav');
  if(!nav)return;
  const menus=menusDe((CFG&&CFG.menus)||[{titulo:'Inicio',destino:'inicio',visible:true},{titulo:'Catálogo',destino:'catalogo',visible:true}]);
  nav.innerHTML=menus.map(m=>'<a class="'+(m.destino==='catalogo'?'on':'')+'" href="'+esc(destinoMenu(m))+'">'+esc(m.destino==='panel'?'Iniciar sesión':m.titulo)+'</a>').join('');
}
pintarMenu();
pintaBarra();
if(MODO==='prenda'){
  document.body.classList.add('es-prenda');
  const it=itemDe(PRENDA);
  if(!it){$('#grid').hidden=true;$('#hoja').hidden=false;$('#hoja').innerHTML='<div class=vacio><p>Esta prenda ya no está en el catálogo.</p><p><a href="/HOBA-IMPACT/c">Volver al catálogo</a></p></div>';}
  else pintarHoja(it);
}else{
  armarFiltros();
  const _q=new URLSearchParams(location.search);
  [['tipo','fTipo'],['disp','fDisp'],['color','fColor'],['talla','fTalla'],['para','fPara']].forEach(function(par){
    const v=_q.get(par[0]); const el=$('#'+par[1]);
    if(v&&el&&[...el.options].some(o=>o.value===v)) el.value=v;
  });
  leerFiltros();
  pintaGrupos();
  pintaGrid();
  if(location.hash.indexOf('#p')===0){const abiertoId=+location.hash.slice(2);if(itemDe(abiertoId))location.replace('/HOBA-IMPACT/c/p/'+abiertoId+'/')}
}
(function(){
  const a=document.createElement('a');
  a.className='wa-flot';
  a.target='_blank';
  a.rel='noopener noreferrer';
  a.setAttribute('aria-label','Hablar con un asesor por WhatsApp');
  a.href='https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, quiero hablar con un asesor de HOBA Impact');
  a.innerHTML='<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="#fff" d="M12.04 2C6.58 2 2.15 6.4 2.15 11.83c0 1.74.46 3.44 1.34 4.94L2 22l5.39-1.41a10 10 0 0 0 4.65 1.18h.01c5.46 0 9.89-4.4 9.89-9.83C21.94 6.4 17.5 2 12.04 2zm5.76 13.86c-.24.68-1.4 1.3-1.94 1.38-.5.08-1.12.11-1.81-.11-.42-.14-.95-.31-1.64-.6-2.88-1.24-4.76-4.14-4.9-4.33-.14-.19-1.16-1.54-1.16-2.94s.73-2.08 1-2.37c.24-.28.64-.41 1.02-.41.12 0 .23 0 .33.01.3.01.44-.05.68.52.24.6.83 2.06.9 2.21.07.15.12.32.02.52-.1.19-.14.32-.28.49-.14.17-.3.38-.42.51-.14.14-.28.29-.12.56.16.28.72 1.18 1.54 1.91 1.06.94 1.95 1.23 2.23 1.37.28.14.44.12.6-.07.16-.19.7-.81.88-1.09.19-.28.37-.23.62-.14.26.09 1.62.76 1.9.9.28.14.46.21.53.32.07.12.07.68-.17 1.36z"/></svg><span>Asesor</span>';
  document.body.appendChild(a);
  const visita={pagina:MODO==='prenda'?'prenda':'catalogo'};
  if(MODO==='prenda'){const it=itemDe(PRENDA);if(it){visita.accion='ver';visita.producto=it.id;visita.nombre=it.nombre||''}}
  anotarVisita(visita);
})();
</script>
</body>
